name: Validate Skills

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-skills:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Validate Local Skills Structure
      run: |
        if [ -d "skills/react-components" ]; then
          cd skills/react-components
          npm ci
          node scripts/validate.js examples/gold-standard-card.tsx
        else
          echo "No legacy react-components skill folder found. Skipping."
        fi

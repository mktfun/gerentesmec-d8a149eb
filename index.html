
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consórcio Flash Sim - Simulador Profissional</title>
    <meta name="description" content="Simulador profissional de consórcio - Faça simulações completas em tempo real" />
    <meta name="author" content="JJ & AMORIM" />

    <meta property="og:title" content="Consórcio Flash Sim" />
    <meta property="og:description" content="Simulador profissional de consórcio - Faça simulações completas em tempo real" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const nav = document.querySelector('header');
        if (!nav) return;

        // Função que atualiza o estado do navbar
        function updateNavState() {
          if (window.scrollY > 50) { // Gatilho: rolar mais de 50px
            nav.dataset.state = 'true';
          } else {
            nav.dataset.state = 'false';
          }
        }

        // Adiciona o 'escutador' de scroll
        window.addEventListener('scroll', updateNavState);

        // Roda uma vez no carregamento da página pra definir o estado inicial
        updateNavState();
      });
    </script>
  </body>
</html>

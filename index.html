<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GerentesMec — CRM de Qualidade</title>
    <meta name="description" content="Plataforma de auditoria e controle de qualidade no atendimento de mecânicas." />
    <meta name="author" content="GerentesMec" />

    <meta property="og:title" content="GerentesMec CRM" />
    <meta property="og:description" content="Dashboard de controle de qualidade de gerentes de mecânicas." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const nav = document.querySelector('header');
        if (!nav) return;

        // Função que atualiza o estado do navbar
        function updateNavState() {
          if (window.scrollY > 50) { // Gatilho: rolar mais de 50px
            nav.dataset.state = 'true';
          } else {
            nav.dataset.state = 'false';
          }
        }

        // Adiciona o 'escutador' de scroll
        window.addEventListener('scroll', updateNavState);

        // Roda uma vez no carregamento da página pra definir o estado inicial
        updateNavState();
      });
    </script>
  </body>
</html>
